<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0E1220">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="Upgrade — أنت غير متصل بالإنترنت حالياً. المحتوى المحفوظ مسبقاً جاهز للقراءة.">
  <title>غير متصل — Upgrade</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <style>
    /* ÊLAN v4 / ζ4 — Self-contained offline page.
       No external font CDN. System Arabic stack mirrors β2 voice fallbacks
       so the page still reads with grace if the platform is launched
       cold (no precache yet). Emoji intentionally absent
       (ICONOGRAPHY DOCTRINE § ٣.أ). The wifi-off glyph is sourced
       verbatim from Lucide (ISC license) and embedded inline because
       this page MUST work without the sprite system. */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: "Markazi Text", "Vazirmatn", "Cairo", "Tajawal",
                   system-ui, -apple-system, "Segoe UI", "SF Arabic", sans-serif;
      background:
        radial-gradient(ellipse at 50% 0%, hsl(225 35% 13%) 0%, hsl(225 35% 8%) 70%);
      color: hsl(40 18% 96%);
      min-height: 100vh;
      min-height: 100svh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 32px 20px; text-align: center;
      line-height: 1.6;
    }
    .card {
      max-width: 520px;
      padding: 40px 32px;
      background: color-mix(in oklch, hsl(225 35% 13%) 80%, transparent);
      backdrop-filter: blur(24px) saturate(160%);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      border: 1px solid color-mix(in oklch, hsl(45 80% 50%) 22%, transparent);
      border-radius: 24px;
      box-shadow:
        0 16px 48px hsl(225 35% 4% / 0.5),
        inset 0 1px 0 hsl(40 18% 96% / 0.06);
    }
    .icon-frame {
      width: 88px; height: 88px;
      margin: 0 auto 20px;
      border-radius: 22px;
      background:
        linear-gradient(135deg,
          color-mix(in oklch, hsl(45 80% 50%) 28%, transparent),
          color-mix(in oklch, hsl(0 65% 45%) 22%, transparent));
      border: 1px solid color-mix(in oklch, hsl(45 80% 50%) 32%, transparent);
      display: grid; place-items: center;
      box-shadow: 0 8px 24px hsl(225 35% 4% / 0.35);
    }
    .icon-frame svg {
      width: 44px; height: 44px;
      stroke: hsl(45 80% 75%);
      stroke-width: 1.75;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    h1 {
      font-size: clamp(1.5rem, 4vw, 2.1rem);
      font-weight: 800;
      margin: 0 0 12px;
      letter-spacing: -0.01em;
    }
    p {
      color: hsl(40 12% 78%);
      font-size: 1.05rem;
      line-height: 1.85;
      margin: 0 0 24px;
    }
    .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    button, a.btn {
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 12px 26px;
      border-radius: 12px;
      cursor: pointer;
      border: 1px solid transparent;
      text-decoration: none;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }
    .btn-primary {
      background: linear-gradient(135deg,
        hsl(45 80% 50%),
        hsl(35 75% 45%));
      color: hsl(225 35% 8%);
      border-color: color-mix(in oklch, hsl(45 80% 50%) 40%, transparent);
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 22px color-mix(in oklch, hsl(45 80% 50%) 35%, transparent);
    }
    .btn-ghost {
      background: hsl(40 18% 96% / 0.04);
      color: hsl(40 18% 92%);
      border-color: hsl(40 18% 96% / 0.12);
    }
    .btn-ghost:hover {
      background: hsl(40 18% 96% / 0.08);
    }
    .hint {
      margin-top: 28px;
      font-size: 0.82rem;
      color: hsl(40 12% 56%);
      letter-spacing: 0.02em;
    }
    .hint code {
      background: color-mix(in oklch, hsl(45 80% 50%) 12%, transparent);
      color: hsl(45 80% 75%);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: ui-monospace, "JetBrains Mono", SFMono-Regular, monospace;
      font-size: 0.78rem;
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
    @media (prefers-color-scheme: light) {
      body {
        background:
          radial-gradient(ellipse at 50% 0%, hsl(36 22% 96%) 0%, hsl(36 18% 92%) 70%);
        color: hsl(225 35% 8%);
      }
      .card {
        background: color-mix(in oklch, hsl(36 22% 96%) 86%, transparent);
        border-color: color-mix(in oklch, hsl(0 65% 32%) 22%, transparent);
      }
      .icon-frame {
        background:
          linear-gradient(135deg,
            color-mix(in oklch, hsl(0 65% 32%) 18%, transparent),
            color-mix(in oklch, hsl(45 80% 35%) 14%, transparent));
        border-color: color-mix(in oklch, hsl(0 65% 32%) 28%, transparent);
      }
      .icon-frame svg { stroke: hsl(0 65% 32%); }
      p { color: hsl(225 22% 28%); }
      .btn-primary {
        background: linear-gradient(135deg,
          hsl(0 65% 32%),
          hsl(15 55% 38%));
        color: hsl(40 18% 96%);
      }
      .btn-ghost { color: hsl(225 35% 14%); border-color: hsl(225 35% 8% / 0.15); background: hsl(225 35% 8% / 0.04); }
      .hint { color: hsl(225 22% 38%); }
      .hint code { color: hsl(0 65% 32%); background: color-mix(in oklch, hsl(0 65% 32%) 8%, transparent); }
    }
  </style>
</head>
<body data-world="hibr">
  <main class="card" role="main">
    <div class="icon-frame" aria-hidden="true">
      <!-- Lucide wifi-off (ISC) — embedded verbatim. Self-contained for offline page. -->
      <svg viewBox="0 0 24 24" role="img" aria-label="بلا اتصال">
        <path d="M12 20h.01"/>
        <path d="M8.5 16.429a5 5 0 0 1 7 0"/>
        <path d="M5 12.859a10 10 0 0 1 5.17-2.69"/>
        <path d="M19 12.859a10 10 0 0 0-2.007-1.523"/>
        <path d="M2 8.82a15 15 0 0 1 4.177-2.643"/>
        <path d="M22 8.82a15 15 0 0 0-11.288-3.764"/>
        <path d="m2 2 20 20"/>
      </svg>
    </div>
    <h1>أنت غير متصل بالإنترنت</h1>
    <p>المنصة محفوظة محلياً. حالما يعود الاتصال، كل شيء راح يشتغل بشكل طبيعي. تكدر تجرب إعادة المحاولة الحين.</p>
    <div class="actions">
      <button class="btn-primary" type="button" onclick="location.reload()">إعادة المحاولة</button>
      <a class="btn btn-ghost" href="./index.html">العودة للرئيسية</a>
    </div>
    <p class="hint">Upgrade · ÊLAN <code>v4</code></p>
  </main>
  <script>
    // Auto-reload when connection comes back
    window.addEventListener('online', () => { setTimeout(() => location.reload(), 400); });
  </script>
</body>
</html>
