<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0E1220">
  <meta name="description" content="Upgrade — أنت غير متصل بالإنترنت حالياً.">
  <title>غير متصل — Upgrade</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: "Cairo", system-ui, -apple-system, "Segoe UI", sans-serif;
      background: radial-gradient(ellipse at 50% 0%, #161B2D 0%, #0E1220 60%);
      color: hsl(220 20% 98%);
      min-height: 100vh;
      min-height: 100svh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 32px 20px; text-align: center;
    }
    .card {
      max-width: 520px;
      padding: 40px 32px;
      background: rgba(22, 27, 45, 0.55);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(102, 252, 241, 0.18);
      border-radius: 24px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }
    .icon {
      width: 88px; height: 88px;
      margin: 0 auto 20px;
      border-radius: 22px;
      background: linear-gradient(135deg, #66FCF1, #4F46E5);
      display: flex; align-items: center; justify-content: center;
      font-size: 44px; line-height: 1;
      box-shadow: 0 8px 24px rgba(102, 252, 241, 0.3);
    }
    h1 {
      font-size: clamp(1.5rem, 4vw, 2.1rem);
      font-weight: 900;
      margin: 0 0 12px;
      letter-spacing: -0.01em;
    }
    p {
      color: hsl(220 15% 75%);
      font-size: 1rem;
      line-height: 1.75;
      margin: 0 0 24px;
    }
    .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    button, a.btn {
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 12px 26px;
      border-radius: 12px;
      cursor: pointer;
      border: 1px solid transparent;
      text-decoration: none;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }
    .btn-primary {
      background: linear-gradient(135deg, #66FCF1, #45A29E);
      color: #0E1220;
      border-color: rgba(102, 252, 241, 0.4);
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 22px rgba(102, 252, 241, 0.35);
    }
    .btn-ghost {
      background: rgba(255, 255, 255, 0.04);
      color: hsl(220 20% 92%);
      border-color: rgba(255, 255, 255, 0.12);
    }
    .btn-ghost:hover {
      background: rgba(255, 255, 255, 0.08);
    }
    .hint {
      margin-top: 28px;
      font-size: 0.8rem;
      color: hsl(220 12% 55%);
      letter-spacing: 0.02em;
    }
    .hint code {
      background: rgba(102, 252, 241, 0.08);
      color: #66FCF1;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 0.78rem;
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="card" role="main">
    <div class="icon" aria-hidden="true">📶</div>
    <h1>أنت غير متصل بالإنترنت</h1>
    <p>المنصة محفوظة محلياً. حالما يعود الاتصال، كل شيء راح يشتغل بشكل طبيعي. تكدر تجرب إعادة المحاولة الحين.</p>
    <div class="actions">
      <button class="btn-primary" type="button" onclick="location.reload()">إعادة المحاولة</button>
      <a class="btn btn-ghost" href="./index.html">العودة للرئيسية</a>
    </div>
    <p class="hint">Upgrade · Cathedral <code>v16 ATELIER</code></p>
  </main>
  <script>
    // Auto-reload when connection comes back
    window.addEventListener('online', () => { setTimeout(() => location.reload(), 400); });
  </script>
</body>
</html>
