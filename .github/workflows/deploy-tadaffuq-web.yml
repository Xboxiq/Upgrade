name: Deploy tadaffuq (Flutter Web) to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'tadaffuq/**'
      - '.github/workflows/deploy-tadaffuq-web.yml'
  workflow_dispatch:

# Permissions required for deploying to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tadaffuq
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      # base-href must match the repo name so assets resolve under
      # https://<owner>.github.io/<repo>/
      - name: Build web
        run: flutter build web --release --base-href /Upgrade/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: tadaffuq/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
